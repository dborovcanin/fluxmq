version: 1

listeners:
  mqtt: []
  amqp1: []
  amqp091:
    - address: ":5682"
      auth: external
      tls:
        cert_file: /run/secrets/fluxmq_server_cert
        key_file: /run/secrets/fluxmq_server_key
        min_version: "1.2"
    - address: "172.30.0.2:5683"
      auth: local
      max_connections: 32
      tls:
        cert_file: /run/secrets/fluxmq_server_cert
        key_file: /run/secrets/fluxmq_server_key
        client_ca_file: /run/secrets/local_client_ca
        min_version: "1.2"

admin:
  address: ":8082"

health:
  enabled: true
  address: ":8081"

storage:
  type: badger
  data_dir: /var/lib/fluxmq
  badger_sync_writes: true

broker:
  max_message_size: 1048576

auth:
  external:
    url: "https://fluxmq-auth:8181"
    transport: http
    timeout: 2s
    protocols:
      amqp091: true
    identity_cache_size: 50000
    identity_cache_ttl: 1h
  local_principals:
    - name: audit-publisher
      certificate_uri_san: spiffe://example.org/audit-publisher
      role: publisher
      current_secret_file: /run/secrets/audit_secret_current
      previous_secret_file: /run/secrets/audit_secret_previous
      permissions:
        publish:
          - exchange: ""
            routing_key: audit.events
        subscribe: []

queues:
  - name: audit.events
    topics: ["$queue/audit.events/#"]
    reserved: true
    type: stream
    retention:
      max_age: 720h
      max_length_bytes: 10737418240
    limits:
      max_message_size: 1048576
      message_ttl: 720h

log:
  level: info
  format: json
