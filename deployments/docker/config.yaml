version: 1

listeners:
  mqtt:
    - address: ":1883"
      transport: tcp
      versions: ["3.1.1", "5.0"]
  amqp091:
    - address: ":5682"
      auth: external
  amqp1:
    - address: ":5672"

admin:
  address: ":8082"

health:
  enabled: true
  address: ":8081"

storage:
  type: badger
  data_dir: /var/lib/fluxmq

broker:
  async_fan_out: false
  fan_out_workers: 0

session:
  inflight_overflow: backpressure
  pending_queue_size: 1000

log:
  level: info
  format: json
