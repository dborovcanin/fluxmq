# Production single-node stable-core configuration.
version: 1

listeners:
  mqtt:
    - address: ":1883"
      transport: tcp
      versions: ["3.1.1", "5.0"]
  amqp091:
    - address: ":5682"
      auth: external
  amqp1:
    - address: ":5672"

# The admin API can reload configuration, delete and purge queues, and
# disconnect sessions, and it has no authentication yet. Keep it on loopback
# and reach it through a trusted proxy.
admin:
  address: "127.0.0.1:8082"

health:
  enabled: true
  address: ":8081"

storage:
  type: badger
  data_dir: /var/lib/fluxmq
  sync_writes: true

log:
  level: info
  format: json
